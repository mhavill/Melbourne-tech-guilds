<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg4Grad)"/>
  
  <!-- Large decorative gears -->
  <g opacity="0.12" stroke="white" stroke-width="4" fill="none">
    <!-- Gear 1 (top left) -->
    <circle cx="480" cy="270" r="120"/>
    <g transform="translate(480, 270)">
      <rect x="-12" y="-135" width="24" height="30" rx="4" fill="white"/>
      <rect x="105" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-12" y="105" width="24" height="30" rx="4" fill="white"/>
      <rect x="-135" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-105" y="-105" width="24" height="30" rx="4" fill="white" transform="rotate(45 -93 -90)"/>
      <rect x="81" y="-105" width="24" height="30" rx="4" fill="white" transform="rotate(-45 93 -90)"/>
      <rect x="81" y="81" width="24" height="30" rx="4" fill="white" transform="rotate(45 93 93)"/>
      <rect x="-105" y="81" width="24" height="30" rx="4" fill="white" transform="rotate(-45 -93 93)"/>
    </g>
    
    <!-- Gear 2 (top right) -->
    <circle cx="1320" cy="337.5" r="150"/>
    <g transform="translate(1320, 337.5)">
      <rect x="-12" y="-165" width="24" height="30" rx="4" fill="white"/>
      <rect x="135" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-12" y="135" width="24" height="30" rx="4" fill="white"/>
      <rect x="-165" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-120" y="-120" width="24" height="30" rx="4" fill="white" transform="rotate(45 -108 -108)"/>
      <rect x="96" y="-120" width="24" height="30" rx="4" fill="white" transform="rotate(-45 108 -108)"/>
      <rect x="96" y="96" width="24" height="30" rx="4" fill="white" transform="rotate(45 108 108)"/>
      <rect x="-120" y="96" width="24" height="30" rx="4" fill="white" transform="rotate(-45 -108 108)"/>
    </g>
    
    <!-- Gear 3 (bottom left) -->
    <circle cx="720" cy="742.5" r="135"/>
    <g transform="translate(720, 742.5)">
      <rect x="-12" y="-150" width="24" height="30" rx="4" fill="white"/>
      <rect x="120" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-12" y="120" width="24" height="30" rx="4" fill="white"/>
      <rect x="-150" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-112.5" y="-112.5" width="24" height="30" rx="4" fill="white" transform="rotate(45 -100.5 -100.5)"/>
      <rect x="88.5" y="-112.5" width="24" height="30" rx="4" fill="white" transform="rotate(-45 100.5 -100.5)"/>
      <rect x="88.5" y="88.5" width="24" height="30" rx="4" fill="white" transform="rotate(45 100.5 100.5)"/>
      <rect x="-112.5" y="88.5" width="24" height="30" rx="4" fill="white" transform="rotate(-45 -100.5 100.5)"/>
    </g>
    
    <!-- Gear 4 (bottom right) -->
    <circle cx="1560" cy="810" r="105"/>
    <g transform="translate(1560, 810)">
      <rect x="-12" y="-120" width="24" height="30" rx="4" fill="white"/>
      <rect x="90" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-12" y="90" width="24" height="30" rx="4" fill="white"/>
      <rect x="-120" y="-12" width="30" height="24" rx="4" fill="white"/>
      <rect x="-90" y="-90" width="24" height="30" rx="4" fill="white" transform="rotate(45 -78 -78)"/>
      <rect x="66" y="-90" width="24" height="30" rx="4" fill="white" transform="rotate(-45 78 -78)"/>
      <rect x="66" y="66" width="24" height="30" rx="4" fill="white" transform="rotate(45 78 78)"/>
      <rect x="-90" y="66" width="24" height="30" rx="4" fill="white" transform="rotate(-45 -78 78)"/>
    </g>
  </g>
  
  <!-- Connecting lines between gears -->
  <g opacity="0.08" stroke="white" stroke-width="3" fill="none">
    <line x1="600" y1="270" x2="1170" y2="337.5"/>
    <line x1="840" y1="405" x2="720" y2="607.5"/>
    <line x1="855" y1="742.5" x2="1455" y2="810"/>
  </g>
  
  <!-- Small accent circles -->
  <g opacity="0.1" fill="white">
    <circle cx="240" cy="540" r="45"/>
    <circle cx="1680" cy="135" r="60"/>
    <circle cx="1200" cy="945" r="52.5"/>
    <circle cx="360" cy="945" r="48"/>
    <circle cx="1800" cy="607.5" r="55"/>
  </g>
  
  <!-- Additional small gears -->
  <g opacity="0.08" stroke="white" stroke-width="2" fill="none">
    <circle cx="240" cy="135" r="45"/>
    <g transform="translate(240, 135)">
      <rect x="-6" y="-51" width="12" height="12" rx="2" fill="white"/>
      <rect x="39" y="-6" width="12" height="12" rx="2" fill="white"/>
      <rect x="-6" y="39" width="12" height="12" rx="2" fill="white"/>
      <rect x="-51" y="-6" width="12" height="12" rx="2" fill="white"/>
    </g>
    
    <circle cx="1680" cy="945" r="52.5"/>
    <g transform="translate(1680, 945)">
      <rect x="-6" y="-58.5" width="12" height="12" rx="2" fill="white"/>
      <rect x="46.5" y="-6" width="12" height="12" rx="2" fill="white"/>
      <rect x="-6" y="46.5" width="12" height="12" rx="2" fill="white"/>
      <rect x="-58.5" y="-6" width="12" height="12" rx="2" fill="white"/>
    </g>
  </g>
</svg>