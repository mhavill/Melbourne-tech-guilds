<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fee140;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg3Grad)"/>
  
  <!-- Network connections -->
  <g opacity="0.15" stroke="white" stroke-width="3" fill="none">
    <!-- Main network -->
    <line x1="240" y1="135" x2="720" y2="270"/>
    <line x1="720" y1="270" x2="1200" y2="202.5"/>
    <line x1="1200" y1="202.5" x2="1680" y2="337.5"/>
    <line x1="1680" y1="337.5" x2="1440" y2="540"/>
    <line x1="1440" y1="540" x2="960" y2="675"/>
    <line x1="960" y1="675" x2="480" y2="607.5"/>
    <line x1="480" y1="607.5" x2="240" y2="405"/>
    <line x1="240" y1="405" x2="240" y2="135"/>
    
    <!-- Cross connections -->
    <line x1="720" y1="270" x2="960" y2="675"/>
    <line x1="1200" y1="202.5" x2="480" y2="607.5"/>
    <line x1="1680" y1="337.5" x2="240" y2="405"/>
    <line x1="1440" y1="540" x2="720" y2="270"/>
    
    <!-- Bottom network -->
    <line x1="360" y1="810" x2="840" y2="877.5"/>
    <line x1="840" y1="877.5" x2="1320" y2="810"/>
    <line x1="1320" y1="810" x2="1560" y2="945"/>
    <line x1="840" y1="877.5" x2="1080" y2="1012.5"/>
    <line x1="360" y1="810" x2="600" y2="945"/>
    
    <!-- Additional connections -->
    <line x1="1440" y1="135" x2="1680" y2="202.5"/>
    <line x1="1680" y1="202.5" x2="1800" y2="337.5"/>
    <line x1="240" y1="810" x2="360" y2="945"/>
  </g>
  
  <!-- Network nodes -->
  <g opacity="0.2" fill="white">
    <!-- Main nodes -->
    <circle cx="240" cy="135" r="22.5"/>
    <circle cx="720" cy="270" r="30"/>
    <circle cx="1200" cy="202.5" r="27"/>
    <circle cx="1680" cy="337.5" r="33"/>
    <circle cx="1440" cy="540" r="25.5"/>
    <circle cx="960" cy="675" r="28.5"/>
    <circle cx="480" cy="607.5" r="24"/>
    <circle cx="240" cy="405" r="30"/>
    
    <!-- Bottom nodes -->
    <circle cx="360" cy="810" r="21"/>
    <circle cx="840" cy="877.5" r="27"/>
    <circle cx="1320" cy="810" r="24"/>
    <circle cx="1560" cy="945" r="22.5"/>
    <circle cx="1080" cy="1012.5" r="25.5"/>
    <circle cx="600" cy="945" r="21"/>
    
    <!-- Additional nodes -->
    <circle cx="1440" cy="135" r="24"/>
    <circle cx="1680" cy="202.5" r="27"/>
    <circle cx="1800" cy="337.5" r="21"/>
    <circle cx="240" cy="810" r="22.5"/>
    <circle cx="360" cy="945" r="24"/>
  </g>
  
  <!-- Scattered accent dots -->
  <g opacity="0.1" fill="white">
    <circle cx="600" cy="472.5" r="10"/>
    <circle cx="1080" cy="405" r="12"/>
    <circle cx="1320" cy="607.5" r="8"/>
    <circle cx="840" cy="135" r="14"/>
    <circle cx="360" cy="675" r="10"/>
    <circle cx="1680" cy="675" r="12"/>
    <circle cx="120" cy="540" r="9"/>
    <circle cx="1800" cy="810" r="11"/>
    <circle cx="480" cy="270" r="10"/>
    <circle cx="1560" cy="472.5" r="13"/>
  </g>
</svg>