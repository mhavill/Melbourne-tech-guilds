<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for each guild -->
    <linearGradient id="roboticsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mechanicsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deepdiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- ROBOTICS GUILD -->
  <g transform="translate(100, 150)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="url(#roboticsGrad)"/>
    
    <!-- Robot head -->
    <rect x="-30" y="-25" width="60" height="50" rx="8" fill="white" opacity="0.9"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-10" r="8" fill="#667eea"/>
    <circle cx="15" cy="-10" r="8" fill="#667eea"/>
    <circle cx="-15" cy="-10" r="4" fill="white"/>
    <circle cx="15" cy="-10" r="4" fill="white"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-25" x2="0" y2="-40" stroke="white" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="-40" r="4" fill="white" opacity="0.9"/>
    
    <!-- Mouth/display -->
    <rect x="-20" y="5" width="40" height="12" rx="2" fill="#667eea" opacity="0.5"/>
    
    <!-- Neural network nodes -->
    <g opacity="0.4">
      <circle cx="-25" cy="35" r="3" fill="white"/>
      <circle cx="-10" cy="35" r="3" fill="white"/>
      <circle cx="10" cy="35" r="3" fill="white"/>
      <circle cx="25" cy="35" r="3" fill="white"/>
      <line x1="-25" y1="35" x2="-10" y2="35" stroke="white" stroke-width="1.5"/>
      <line x1="-10" y1="35" x2="10" y2="35" stroke="white" stroke-width="1.5"/>
      <line x1="10" y1="35" x2="25" y2="35" stroke="white" stroke-width="1.5"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#667eea" text-anchor="middle">ROBOTICS</text>
  </g>
  
  <!-- MECHANICS GUILD -->
  <g transform="translate(340, 150)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="url(#mechanicsGrad)"/>
    
    <!-- Main gear -->
    <g>
      <!-- Gear teeth -->
      <circle cx="0" cy="0" r="35" fill="white" opacity="0.9"/>
      <path d="M 0,-40 L 6,-42 L 8,-36 L 6,-30 L 0,-35
               M 28,-28 L 33,-32 L 38,-28 L 35,-22 L 28,-24
               M 40,0 L 42,6 L 36,8 L 30,6 L 35,0
               M 28,28 L 35,22 L 38,28 L 33,32 L 28,24
               M 0,40 L -6,42 L -8,36 L -6,30 L 0,35
               M -28,28 L -33,32 L -38,28 L -35,22 L -28,24
               M -40,0 L -42,-6 L -36,-8 L -30,-6 L -35,0
               M -28,-28 L -35,-22 L -38,-28 L -33,-32 L -28,-24"
            fill="white" opacity="0.9"/>
      <circle cx="0" cy="0" r="12" fill="#f5576c"/>
    </g>
    
    <!-- Small gear (interlocked) -->
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="18" fill="white" opacity="0.8"/>
      <path d="M 0,-20 L 3,-22 L 4,-18 L 2,-14 L 0,-17
               M 14,-14 L 17,-17 L 20,-14 L 18,-10 L 14,-12
               M 20,0 L 22,3 L 18,4 L 14,2 L 17,0
               M 14,14 L 18,10 L 20,14 L 17,17 L 14,12
               M 0,20 L -3,22 L -4,18 L -2,14 L 0,17
               M -14,14 L -17,17 L -20,14 L -18,10 L -14,12
               M -20,0 L -22,-3 L -18,-4 L -14,-2 L -17,0
               M -14,-14 L -18,-10 L -20,-14 L -17,-17 L -14,-12"
            fill="white" opacity="0.8"/>
      <circle cx="0" cy="0" r="6" fill="#f5576c"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#f5576c" text-anchor="middle">MECHANICS</text>
  </g>
  
  <!-- IoT GUILD -->
  <g transform="translate(580, 150)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="url(#iotGrad)"/>
    
    <!-- Microcontroller chip -->
    <rect x="-25" y="-25" width="50" height="50" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Chip pins -->
    <g fill="#00f2fe" opacity="0.7">
      <rect x="-30" y="-18" width="5" height="3"/>
      <rect x="-30" y="-8" width="5" height="3"/>
      <rect x="-30" y="2" width="5" height="3"/>
      <rect x="-30" y="12" width="5" height="3"/>
      
      <rect x="25" y="-18" width="5" height="3"/>
      <rect x="25" y="-8" width="5" height="3"/>
      <rect x="25" y="2" width="5" height="3"/>
      <rect x="25" y="12" width="5" height="3"/>
      
      <rect x="-18" y="-30" width="3" height="5"/>
      <rect x="-8" y="-30" width="3" height="5"/>
      <rect x="2" y="-30" width="3" height="5"/>
      <rect x="12" y="-30" width="3" height="5"/>
      
      <rect x="-18" y="25" width="3" height="5"/>
      <rect x="-8" y="25" width="3" height="5"/>
      <rect x="2" y="25" width="3" height="5"/>
      <rect x="12" y="25" width="3" height="5"/>
    </g>
    
    <!-- Chip label -->
    <text x="0" y="5" font-family="monospace" font-size="10" font-weight="bold" 
          fill="#00f2fe" text-anchor="middle">ESP32</text>
    
    <!-- Wireless signal -->
    <g stroke="white" fill="none" stroke-width="2" opacity="0.7">
      <path d="M -35,-35 Q -30,-30 -25,-35"/>
      <path d="M -40,-40 Q -30,-30 -20,-40"/>
      <path d="M -45,-45 Q -30,-30 -15,-45"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#00f2fe" text-anchor="middle">IoT</text>
  </g>
  
  <!-- CODING GUILD -->
  <g transform="translate(820, 150)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="url(#codingGrad)"/>
    
    <!-- Code brackets -->
    <path d="M -35,-30 L -45,-15 L -45,15 L -35,30" stroke="white" stroke-width="4" 
          fill="none" opacity="0.9" stroke-linecap="round"/>
    <path d="M 35,-30 L 45,-15 L 45,15 L 35,30" stroke="white" stroke-width="4" 
          fill="none" opacity="0.9" stroke-linecap="round"/>
    
    <!-- Code symbols -->
    <g fill="white" opacity="0.9" font-family="monospace" font-size="24" font-weight="bold">
      <text x="-15" y="-5" text-anchor="middle">&lt;</text>
      <text x="0" y="10" text-anchor="middle">/</text>
      <text x="15" y="-5" text-anchor="middle">&gt;</text>
    </g>
    
    <!-- Binary background -->
    <g fill="white" opacity="0.3" font-family="monospace" font-size="10">
      <text x="-30" y="40" text-anchor="middle">101</text>
      <text x="0" y="45" text-anchor="middle">010</text>
      <text x="30" y="40" text-anchor="middle">110</text>
    </g>
    
    <!-- Label -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#38f9d7" text-anchor="middle">CODING</text>
  </g>
  
  <!-- DEEP DIVE GUILD -->
  <g transform="translate(1060, 150)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="url(#deepdiveGrad)"/>
    
    <!-- Mathematical symbols and formulas -->
    <g fill="white" opacity="0.9">
      <!-- Integral symbol -->
      <text x="-25" y="-10" font-family="serif" font-size="36" font-style="italic">∫</text>
      
      <!-- Pi symbol -->
      <text x="10" y="-5" font-family="serif" font-size="28" font-style="italic">π</text>
      
      <!-- Sigma (summation) -->
      <text x="-20" y="25" font-family="serif" font-size="32" font-weight="bold">Σ</text>
      
      <!-- Ohm symbol -->
      <text x="15" y="25" font-family="serif" font-size="28">Ω</text>
    </g>
    
    <!-- Circuit schematic element -->
    <g stroke="white" stroke-width="2" fill="none" opacity="0.6">
      <line x1="-40" y1="40" x2="-25" y2="40"/>
      <path d="M -25,40 L -20,35 L -15,45 L -10,35 L -5,45 L 0,35"/>
      <line x1="0" y1="35" x2="10" y2="35"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#fee140" text-anchor="middle">DEEP DIVE</text>
  </g>
  
  <!-- Background text -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="14" 
        fill="#999" text-anchor="middle" opacity="0.5">Melbourne Tech Guilds - Guild Icons</text>
</svg>