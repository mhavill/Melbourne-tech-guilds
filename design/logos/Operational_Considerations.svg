<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#iconGrad)" opacity="0.1"/>

  <!-- Pentagon outline (optional, can be removed) -->
  <polygon points="200,50 350,150 300,320 100,320 50,150" 
           fill="none" stroke="#4facfe" stroke-width="2" opacity="0.3"/>

  <!-- Icon 1: Backup and Redundancy (top point) -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Database icon with backup -->
    <g fill="#0288d1">
      <ellipse cx="0" cy="-12" rx="14" ry="5"/>
      <rect x="-14" y="-12" width="28" height="16"/>
      <ellipse cx="0" cy="4" rx="14" ry="5"/>
      <path d="M -14,-12 L -14,4" stroke="#0288d1" stroke-width="2" fill="none"/>
      <path d="M 14,-12 L 14,4" stroke="#0288d1" stroke-width="2" fill="none"/>
      
      <!-- Backup arrow -->
      <path d="M 6,12 Q 12,14 16,10" stroke="#0288d1" stroke-width="2" fill="none"/>
      <polygon points="16,10 14,7 18,8" fill="#0288d1"/>
      <circle cx="16" cy="15" r="2.5" fill="#0288d1"/>
    </g>
  </g>

  <!-- Icon 2: Cloud vs Local (upper right) -->
  <g transform="translate(350, 150)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Cloud on left, house on right -->
    <g fill="#0288d1">
      <!-- Cloud -->
      <path d="M -15,-4 Q -18,-8 -15,-11 Q -12,-13 -8,-12 Q -6,-16 -2,-15 Q 1,-16 3,-12 Q 6,-13 8,-10 Q 10,-7 6,-4 Z"/>
      
      <!-- House -->
      <path d="M -15,6 L -8,0 L -1,6 L -1,14 L -15,14 Z"/>
      <polygon points="-8,0 -11,2 -5,2" fill="white"/>
      <rect x="-12" y="9" width="3" height="5" fill="white"/>
      
      <!-- Double arrow -->
      <path d="M -4,-4 L 2,-4" stroke="#0288d1" stroke-width="2" fill="none"/>
      <polygon points="-4,-4 -2,-6 -2,-2" fill="#0288d1"/>
      <polygon points="2,-4 0,-6 0,-2" fill="#0288d1"/>
    </g>
  </g>

  <!-- Icon 3: Cost of Ownership (lower right) -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Dollar sign with gear -->
    <g fill="#0288d1">
      <!-- Dollar sign -->
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
            fill="#0288d1" text-anchor="middle">$</text>
      
      <!-- Small gear in corner -->
      <g transform="translate(12, -12) scale(0.45)">
        <circle cx="0" cy="0" r="7" fill="#0288d1"/>
        <circle cx="0" cy="0" r="3.5" fill="white"/>
        <rect x="-1.5" y="-9" width="3" height="3" fill="#0288d1"/>
        <rect x="-1.5" y="6" width="3" height="3" fill="#0288d1"/>
        <rect x="-9" y="-1.5" width="3" height="3" fill="#0288d1"/>
        <rect x="6" y="-1.5" width="3" height="3" fill="#0288d1"/>
      </g>
    </g>
  </g>

  <!-- Icon 4: Maintenance (lower left) -->
  <g transform="translate(100, 320)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Wrench and gear -->
    <g fill="#0288d1">
      <!-- Wrench -->
      <path d="M -6,-15 L -6,-6 L -10,-3 L -6,1 L -2,-3 L -6,-6 L -6,-15 Q -8,-17 -6,-18.5 Q -4,-17 -6,-15"/>
      <circle cx="-6" cy="-17" r="2.5" fill="none" stroke="#0288d1" stroke-width="2"/>
      
      <!-- Gear -->
      <circle cx="7" cy="7" r="9" fill="#0288d1"/>
      <circle cx="7" cy="7" r="4.5" fill="white"/>
      <rect x="5.5" y="-3" width="3" height="3" fill="#0288d1"/>
      <rect x="5.5" y="14" width="3" height="3" fill="#0288d1"/>
      <rect x="-3" y="5.5" width="3" height="3" fill="#0288d1"/>
      <rect x="14" y="5.5" width="3" height="3" fill="#0288d1"/>
      <rect x="2" y="2" width="2.5" height="2.5" fill="#0288d1" transform="rotate(45 7 7)"/>
      <rect x="10" y="2" width="2.5" height="2.5" fill="#0288d1" transform="rotate(45 7 7)"/>
      <rect x="2" y="10" width="2.5" height="2.5" fill="#0288d1" transform="rotate(45 7 7)"/>
      <rect x="10" y="10" width="2.5" height="2.5" fill="#0288d1" transform="rotate(45 7 7)"/>
    </g>
  </g>

  <!-- Icon 5: Scalability (upper left) -->
  <g transform="translate(50, 150)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Growing bars/chart -->
    <g fill="#0288d1">
      <rect x="-16" y="8" width="6" height="6" rx="1"/>
      <rect x="-6" y="2" width="6" height="12" rx="1"/>
      <rect x="4" y="-6" width="6" height="20" rx="1"/>
      <rect x="14" y="-12" width="6" height="26" rx="1"/>
      
      <!-- Up arrow -->
      <path d="M -12,-15 L -4,-15" stroke="#0288d1" stroke-width="2" fill="none"/>
      <polygon points="-4,-15 -6,-13 -6,-17" fill="#0288d1"/>
    </g>
  </g>
</svg>