<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon on left: Simple interlocking gears representing collaboration and tech -->
  <g transform="translate(60, 100)">
    <!-- Large gear -->
    <circle cx="0" cy="0" r="40" fill="url(#iconGrad)"/>
    
    <!-- Large gear teeth (8 teeth) -->
    <g fill="#667eea">
      <rect x="-4" y="-45" width="8" height="10" rx="2"/>
      <rect x="29" y="-29" width="8" height="10" rx="2" transform="rotate(45 33 -24)"/>
      <rect x="41" y="-4" width="10" height="8" rx="2"/>
      <rect x="29" y="29" width="8" height="10" rx="2" transform="rotate(-45 33 34)"/>
      <rect x="-4" y="41" width="8" height="10" rx="2"/>
      <rect x="-33" y="29" width="8" height="10" rx="2" transform="rotate(45 -29 34)"/>
      <rect x="-45" y="-4" width="10" height="8" rx="2"/>
      <rect x="-33" y="-33" width="8" height="10" rx="2" transform="rotate(-45 -29 -29)"/>
    </g>
    
    <!-- Large gear center -->
    <circle cx="0" cy="0" r="15" fill="white"/>
    <circle cx="0" cy="0" r="8" fill="#667eea"/>
    
    <!-- Small gear interlocked -->
    <g transform="translate(40, -35)">
      <circle cx="0" cy="0" r="25" fill="url(#iconGrad)"/>
      
      <!-- Small gear teeth (6 teeth) -->
      <g fill="#764ba2">
        <rect x="-3" y="-28" width="6" height="6" rx="1"/>
        <rect x="22" y="-12" width="6" height="6" rx="1" transform="rotate(60 25 -9)"/>
        <rect x="22" y="12" width="6" height="6" rx="1" transform="rotate(-60 25 15)"/>
        <rect x="-3" y="22" width="6" height="6" rx="1"/>
        <rect x="-25" y="12" width="6" height="6" rx="1" transform="rotate(60 -22 15)"/>
        <rect x="-25" y="-12" width="6" height="6" rx="1" transform="rotate(-60 -22 -9)"/>
      </g>
      
      <!-- Small gear center -->
      <circle cx="0" cy="0" r="10" fill="white"/>
      <circle cx="0" cy="0" r="5" fill="#764ba2"/>
    </g>
  </g>
  
  <!-- Main text -->
  <!-- <text x="160" y="95" font-family="Arial, Helvetica, sans-serif" font-size="40" 
        font-weight="00" fill="url(#textGrad)">Melbourne Tech Guilds</text> -->
  
  <!-- Tagline -->
  <!-- <text x="160" y="125" font-family="Arial, Helvetica, sans-serif" font-size="18" 
        font-weight="400" fill="#666" letter-spacing="1">Where Makers Collaborate</text>
   -->
  Optional: Domain
  <!-- <text x="160" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" 
        font-weight="400" fill="#999">melbourne.techguilds.au</text> -->
</svg>